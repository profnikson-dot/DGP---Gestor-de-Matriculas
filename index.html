<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Matrículas/SEMED SSBV - Sistema de Matrículas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}

.login-box{

    width:400px;
    background:white;
    border-radius:15px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);

}

.logo{

    text-align:center;
    margin-bottom:25px;

}

.logo h2{

    color:#1565c0;
    font-weight:bold;

}

.logo p{

    color:#777;

}

.form-control{

    height:50px;

}

.btn-login{

    width:100%;
    height:50px;
    font-size:18px;
    background:#1565c0;
    border:none;

}

.btn-login:hover{

    background:#0d47a1;

}

.footer{

    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:14px;

}

    </style>

</head>
<body>

<div class="login-box">

<div class="logo">

<h2>Gestor de Matrículas</h2>

<p>SEMED SSBV - DGP</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label>Usuário</label>

<input
type="text"
class="form-control"
id="usuario"
placeholder="Digite o usuário"
required>

</div>

<div class="mb-3">

<label>Senha</label>

<input
type="password"
class="form-control"
id="senha"
placeholder="Digite a senha"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-login">

Entrar

</button>

</div>

</form>

<div class="footer">

Desenvolvido por Fox Sistema de Ensino

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

let usuario=document.getElementById("usuario").value;
let senha=document.getElementById("senha").value;

if(usuario=="admin" && senha=="123456"){

window.location="dashboard.html";

}else{

alert("Usuário ou senha inválidos.");

}

});

</script>

</body>
</html>
